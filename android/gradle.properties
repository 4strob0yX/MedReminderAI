# Configuración de Gradle para todo el proyecto.
# Usuarios de IDE (p. ej. Android Studio):
# La configuración de Gradle hecha desde el IDE *tendrá prioridad sobre*
# cualquier valor especificado en este archivo.
# Para más detalles sobre cómo configurar el entorno de compilación visita
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Especifica los argumentos de la JVM usados por el proceso daemon.
# Es especialmente útil para ajustar la memoria.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Si se configura, Gradle se ejecutará en modo paralelo (incubating).
# Esta opción solo debe usarse con proyectos desacoplados. Para más detalles, visita
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Al habilitarse, la caché de configuración permite a Gradle omitir la fase de
# configuración por completo si nada que la afecte (como los scripts de compilación)
# ha cambiado. Además, Gradle aplica optimizaciones de rendimiento a la ejecución de tareas.
org.gradle.configuration-cache=true
# Estilo de código Kotlin del proyecto: "official" u "obsolete":
kotlin.code.style=official